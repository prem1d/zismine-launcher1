name: Build Launcher
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack Source Code
        run: |
          Expand-Archive -Path ./source.zip -DestinationPath ./source_extracted
          if (Test-Path ./source_extracted/ZisMine-Launcher) {
            Move-Item -Path ./source_extracted/ZisMine-Launcher/* -Destination ./source -Force
          } else {
            Move-Item -Path ./source_extracted/* -Destination ./source -Force
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          cd source
          npm install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v1.0.0
          releaseName: 'ZisMine Launcher v1.0.0'
          releaseBody: 'Автоматическая сборка лаунчера.'
          releaseDraft: true
          prerelease: false
          projectPath: ./source
